[project]
name = "foodfast"
version = "1.0.0"
description = "FoodFast inventory management API and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1",
    "requests>=2.34",
]

[project.scripts]
food = "cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "app", "store", "openfoodfacts_client"]
